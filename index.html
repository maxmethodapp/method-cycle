// ── Primitives ──────────────────────────────────────────────────

// ── Dates ───────────────────────────────────────────────────────
const pad2 = n => String(n).padStart(2, '0');
const isoLocal = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const TODAY = isoLocal(new Date());
const parseISO = s => new Date(s + 'T12:00:00');
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate()+n); return isoLocal(d); };
const diffDays = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 86400000);
const fmt = iso => parseISO(iso).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }).replace(/,/g,'').toUpperCase();
const fmtShort = iso => parseISO(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short' });

// ── Cycle maths (Garibaldi C: four broad phases, held loosely) ───
const PHASES = [
  { id:'menstrual', name:'Menstrual', sub:'early follicular', color:M.coral },
  { id:'follicular', name:'Follicular', sub:'late follicular', color:M.mint },
  { id:'ovulation', name:'Ovulation', sub:'mid-cycle', color:M.amber },
  { id:'luteal', name:'Luteal', sub:'pre-menstrual at the end', color:M.slate },
];
function periodStarts(logs) {
  const explicit = logs.filter(l => l.period_start).map(l => l.log_date);
  const byDate = new Set(logs.filter(l => l.period).map(l => l.log_date));
  const inferred = [...byDate].filter(d => !byDate.has(addDays(d, -1)) && !byDate.has(addDays(d, -2)));
  const all = [...new Set([...explicit, ...inferred])].sort();
  // an inferred start within 3 days after an explicit one is the same period, drop it
  return all.filter((d, i) => i === 0 || explicit.includes(d) || diffDays(d, all[i-1]) > 3);
}
function learnedPeriodLen(logs, starts) {
  const ends = logs.filter(l => l.period_end).map(l => l.log_date).sort();
  const lens = starts.map(st => { const en = ends.find(e => e >= st && diffDays(e, st) <= 10); return en ? diffDays(en, st) + 1 : null; }).filter(Boolean);
  return lens.length ? Math.round(lens.reduce((a,b)=>a+b,0) / lens.length) : null;
}
function cycleModel(logs, settings) {
  const starts = periodStarts(logs);
  const gaps = starts.slice(1).map((s, i) => diffDays(s, starts[i])).filter(g => g >= 18 && g <= 45);
  const length = gaps.length ? Math.round(gaps.reduce((a,b)=>a+b,0) / gaps.length) : (settings.cycle_length || 28);
  const lastStart = starts[starts.length - 1] || null;
  const day = lastStart ? diffDays(TODAY, lastStart) + 1 : null;
  const periodLen = learnedPeriodLen(logs, starts) || settings.period_length || 5;
  const ovDay = Math.max(periodLen + 3, length - 14);
  const phaseOf = d => d == null ? null : d <= periodLen ? PHASES[0] : d < ovDay - 1 ? PHASES[1] : d <= ovDay + 1 ? PHASES[2] : PHASES[3];
  const segs = [
    { ...PHASES[0], from:1, to:periodLen }, { ...PHASES[1], from:periodLen+1, to:ovDay-2 },
    { ...PHASES[2], from:ovDay-1, to:ovDay+1 }, { ...PHASES[3], from:ovDay+2, to:length },
  ];
  const nextStart = lastStart ? addDays(lastStart, length) : null;
  // Forward predictions: next 4 cycles from the last logged start. Estimates, held loosely.
  const predicted = [];
  if (lastStart) for (let k = 0; k <= 4; k++) {
    const st = addDays(lastStart, k * length); const ov = addDays(st, ovDay - 1);
    predicted.push({ start: st, end: addDays(st, periodLen - 1), ovStart: addDays(ov, -1), ov, ovEnd: addDays(ov, 1), future: st > TODAY });
  }
  const predictFor = iso => { if (iso <= TODAY) return null; for (const c of predicted) { if (iso >= c.start && iso <= c.end) return 'period'; if (iso >= c.ovStart && iso <= c.ovEnd) return 'ovulation'; } return null; };
  const overdue = day != null && day > length;
  return { starts, length, lastStart, day, phase: phaseOf(day), phaseOf, segs, nextStart, overdue, predicted, predictFor, estimated: gaps.length > 0, periodLen,
    dayFor: iso => { const prior = starts.filter(s => s <= iso); const s = prior[prior.length-1]; return s ? diffDays(iso, s) + 1 : null; } };
}

// Patterns: her data, tentatively worded. Needs >= 3 logs in a phase before it says anything.
function buildPatterns(logs, model) {
  const out = [];
  const byPhase = {};
  logs.forEach(l => { const d = model.dayFor(l.log_date); const p = model.phaseOf(d); if (!p) return; (byPhase[p.id] ||= []).push({ ...l, day:d }); });
  const avg = (arr, k) => { const v = arr.map(x => x[k]).filter(x => x != null); return v.length >= 3 ? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const all = { energy: avg(logs, 'energy'), motivation: avg(logs, 'motivation'), mood: avg(logs, 'mood') };
  PHASES.forEach(p => {
    const arr = byPhase[p.id] || [];
    ['energy','motivation','mood'].forEach(k => {
      const a = avg(arr, k); if (a == null || all[k] == null) return;
      const d = a - all[k];
      if (d <= -0.6) out.push({ color:p.color, t:`You've tended to log lower ${k} in your ${p.name.toLowerCase()} days (${arr.length} logs).` });
      if (d >= 0.6) out.push({ color:p.color, t:`Your ${k} has often read higher in your ${p.name.toLowerCase()} days — a window you may want to use.` });
    });
    const sym = {}; arr.forEach(l => (l.symptoms||[]).forEach(s => sym[s] = (sym[s]||0)+1));
    Object.entries(sym).forEach(([s, n]) => { if (s !== 'good' && arr.length >= 3 && n / arr.length >= 0.5) out.push({ color:p.color, t:`${SYMPTOM_LABEL[s] || s} has come up in ${n} of ${arr.length} ${p.name.toLowerCase()} logs.` }); });
  });
  return out.slice(0, 4);
}

  { id:'headache', label:'Headache' }, { id:'bloating', label:'Bloating' }, { id:'sleep', label:'Poor sleep' }, { id:'flat', label:'Flat / unmotivated' },
];
const SYMPTOM_LABEL = Object.fromEntries(SYMPTOM_OPTS.map(o => [o.id, o.label]));

// ── Storage: Supabase (login) when configured, localStorage otherwise ──
const sb = (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase)

const LOCAL_LOGS = 'method_cycle_logs_local', LOCAL_SETTINGS = 'method_cycle_settings_local';

const store = {
  mode: sb ? 'supabase' : 'local',
  user: null,
  async loadLogs() {
    if (sb) { const { data, error } = await sb.from('cycle_logs').select('*').order('log_date'); if (error) throw error; return data; }
    try { return JSON.parse(localStorage.getItem(LOCAL_LOGS) || '[]').sort((a,b) => a.log_date < b.log_date ? -1 : 1); } catch (e) { return []; }
  },
  async saveLog(entry) {
    const row = { ...entry, updated_at: new Date().toISOString() };
    if (sb) { const { error } = await sb.from('cycle_logs').upsert({ ...row, athlete_id: this.user.id }, { onConflict: 'athlete_id,log_date' }); if (error) throw error; return; }
    const logs = (await this.loadLogs()).filter(l => l.log_date !== entry.log_date);
    localStorage.setItem(LOCAL_LOGS, JSON.stringify([...logs, row]));
  },
  async saveLogs(entries) {
    const now = new Date().toISOString();
    if (sb) { for (let i = 0; i < entries.length; i += 400) { const { error } = await sb.from('cycle_logs').upsert(entries.slice(i, i+400).map(e => ({ ...e, athlete_id: this.user.id, updated_at: now })), { onConflict: 'athlete_id,log_date' }); if (error) throw error; } return; }
    const dates = new Set(entries.map(e => e.log_date));
    const logs = (await this.loadLogs()).filter(l => !dates.has(l.log_date));
    localStorage.setItem(LOCAL_LOGS, JSON.stringify([...logs, ...entries.map(e => ({ ...e, updated_at: now }))]));
  },
  async deleteLog(iso) {
    if (sb) { const { error } = await sb.from('cycle_logs').delete().eq('log_date', iso); if (error) throw error; return; }
    localStorage.setItem(LOCAL_LOGS, JSON.stringify((await this.loadLogs()).filter(l => l.log_date !== iso)));
  },
  async loadSettings() {
    const def = { cycle_length: 28, period_length: 5 };
    if (sb) { const { data } = await sb.from('athlete_settings').select('*').maybeSingle(); return { ...def, ...(data || {}) }; }
    try { return { ...def, ...JSON.parse(localStorage.getItem(LOCAL_SETTINGS) || '{}') }; } catch (e) { return def; }
  },
  async saveSettings(s) {
    if (sb) { const { error } = await sb.from('athlete_settings').upsert({ athlete_id: this.user.id, cycle_length: s.cycle_length, period_length: s.period_length }, { onConflict: 'athlete_id' }); if (error) throw error; return; }
    localStorage.setItem(LOCAL_SETTINGS, JSON.stringify(s));
  },
  async coach(messages, context) {
    if (!sb) return null;
    const { data, error } = await sb.functions.invoke(CFG.COACH_FUNCTION, { body: { messages, context } });
    if (error) throw error;
    return data && data.reply;
  },
  athleteName() {
    if (!sb) return CFG.LOCAL_NAME;
    const u = this.user; const n = (u && u.user_metadata && u.user_metadata.name) || (u && u.email ? u.email.split('@')[0] : 'there');
    return n.charAt(0).toUpperCase() + n.slice(1);
  },
};

      else { const { data, error } = await sb.auth.signUp({ email: email.trim(), password: pw, options: { data: { name: name.trim() } } }); if (error) throw error;
             if (!data.session) setMsg({ ok:true, t:'Check your email to confirm, then sign in.' }); }
    } catch (e) { setMsg({ ok:false, t:e.message }); }
    setBusy(false);
  };
  const reset = async () => { if (!email.trim()) return setMsg({ ok:false, t:'Enter your email first.' }); const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.href.split('#')[0] }); setMsg(error ? { ok:false, t:error.message } : { ok:true, t:'Reset link sent.' }); };
  return <div style={{ maxWidth:480, margin:'0 auto', minHeight:'100vh', background:M.paper, padding:'calc(60px + env(safe-area-inset-top)) 24px 40px', display:'flex', flexDirection:'column', animation:'mFade .3s ease both' }}>

      <button onClick={() => { setMode(mode === 'in' ? 'up' : 'in'); setMsg(null); }} style={{ background:'none', border:'none', fontSize:13, fontWeight:600, color:M.mint600, padding:0 }}>{mode === 'in' ? 'New here? Create account' : 'Have an account? Sign in'}</button>
      {mode === 'in' && <button onClick={reset} style={{ background:'none', border:'none', fontSize:13, color:M.ink400, padding:0 }}>Forgot password</button>}
    </div>
    <div style={{ marginTop:'auto', paddingTop:30, fontSize:11, color:M.ink400, lineHeight:1.5 }}>Cycle data is health data. It's stored in METHOD's database, used only for your coaching, and you can delete it at any time from Settings.</div>
  </div>;
}

// ── Visuals ─────────────────────────────────────────────────────
function CycleRing({ model, size = 176 }) {
  const r = (size - 14) / 2, c = 2 * Math.PI * r;
  const { length, day, segs } = model;
  let acc = 0;
  const angle = day ? ((Math.min(day, length) - 0.5) / length) * 360 - 90 : null;
  return <svg width={size} height={size} style={{ display:'block' }}>
    <g style={{ transform:'rotate(-90deg)', transformOrigin:'center' }}>
      {segs.map((s, i) => { const frac = (s.to - s.from + 1) / length; const dash = c * frac; const off = -acc * c; acc += frac;
        const active = model.phase && model.phase.id === s.id;
        return <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={s.color} strokeWidth={active ? 12 : 8} strokeDasharray={`${Math.max(dash-3,0)} ${c-dash+3}`} strokeDashoffset={off} opacity={active || !model.phase ? 1 : 0.35} strokeLinecap="butt" />; })}
    </g>
    {angle != null && <circle cx={size/2 + r*Math.cos(angle*Math.PI/180)} cy={size/2 + r*Math.sin(angle*Math.PI/180)} r="6" fill={M.ink} stroke={M.paper} strokeWidth="2.5" />}
    <text x="50%" y="46%" textAnchor="middle" fontFamily={FONT.display} fontWeight="700" fontSize={day ? 44 : 20} fill={M.ink} className="tnum">{day ? day : '—'}</text>

// ── History (month grid + list) ─────────────────────────────────

    <div style={{ height:24 }} />
  </div>;

// ── Coach chat (guardrails live in the Edge Function; this fallback mirrors them) ──

  const SUGG = ['Where am I in my cycle?', 'I feel flat today', 'What patterns have you seen?'];
  return <div style={{ display:'flex', flexDirection:'column', height:'calc(100vh - 150px)', animation:'mFade .3s ease both' }}>
    <div style={{ paddingTop:4, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
      <div><Label>Coach</Label><Display size={24} style={{ marginTop:4 }}>M.</Display></div>
      <div style={{ display:'flex', alignItems:'center', gap:12 }}>
      {msgs.length > 1 && <button onClick={clearChat} style={{ background:'none', border:'none', fontFamily:FONT.mono, fontSize:9, letterSpacing:'0.08em', color:M.ink400, padding:0 }}>CLEAR</button>}
      <span style={{ display:'inline-flex', alignItems:'center', gap:5, fontFamily:FONT.mono, fontSize:9, letterSpacing:'0.08em', color:M.ink400 }}><Icon name="shield" size={12} color={live ? M.mint600 : M.ink300} />{live === true ? 'AI · GUARDED' : live === false ? 'OFFLINE · CANNED' : sb ? 'READY' : 'OFFLINE DEMO'}</span>
      </div>
    </div>
    <div ref={ref} className="noscroll" style={{ flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:10, marginTop:16, paddingBottom:10 }}>
      {msgs.map((m, i) => { const c = m.role === 'coach'; return <div key={i} style={{ display:'flex', justifyContent:c ? 'flex-start' : 'flex-end', animation:'mFade .3s ease both' }}>
        <div style={{ maxWidth:'84%', background:c ? M.bone : M.ink, color:c ? M.ink : M.paper, border:c ? `1px solid ${M.ink100}` : 'none', borderRadius:16, borderBottomLeftRadius:c ? 4 : 16, borderBottomRightRadius:c ? 16 : 4, padding:'11px 14px', fontSize:14, lineHeight:1.5 }}>
          {m.text === '__typing__' ? <div style={{ display:'flex', gap:4, padding:'4px 2px' }}>{[0,1,2].map(j => <span key={j} style={{ width:6, height:6, borderRadius:999, background:M.ink300, animation:`mBlink 1.2s ${j*0.18}s infinite` }} />)}</div> : m.text}
        </div></div>; })}
    </div>
    {msgs.length < 3 && <div className="noscroll" style={{ display:'flex', gap:8, overflowX:'auto', paddingBottom:10 }}>{SUGG.map(s => <button key={s} onClick={() => send(s)} className="press" style={{ whiteSpace:'nowrap', padding:'8px 13px', borderRadius:999, border:`1.5px solid ${M.ink100}`, background:M.bone, fontSize:12.5, fontWeight:600 }}>{s}</button>)}</div>}
    <div style={{ display:'flex', gap:8, alignItems:'center' }}>
      <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} placeholder="Ask about training around your cycle…" style={{ flex:1, padding:'13px 15px', borderRadius:999, border:`1.5px solid ${M.ink100}`, background:M.bone, fontSize:14, outline:'none' }} />
      <button onClick={() => send()} className="press" style={{ width:44, height:44, borderRadius:999, border:'none', background:M.ink, display:'flex', alignItems:'center', justifyContent:'center' }}><Icon name="send" size={17} color={M.mint} /></button>
    </div>
    <div style={{ fontSize:10.5, color:M.ink400, marginTop:8, lineHeight:1.4 }}>M. coaches training only. For anything medical, your GP.{liveErr && <span style={{ color:M.coral }}> · AI unavailable: {liveErr}</span>}</div>
  </div>;
}

// ── Settings ────────────────────────────────────────────────────
// ── Import from other trackers (Clue, Flo, Natural Cycles, Apple Health, Garmin…) ──
// Sniffs the file rather than hardcoding one app: finds a date field and a period/flow field.
const FLOW_WORDS = { spotting:'light', light:'light', low:'light', medium:'medium', moderate:'medium', normal:'medium', heavy:'heavy', high:'heavy', super:'heavy', 'very heavy':'heavy' };
function normFlow(v) {
  if (v == null) return null; if (v === true) return 'medium';
  const t = String(v).toLowerCase().replace(/hkcategoryvaluemenstrualflow/, '').trim();
  if (['', 'false', 'no', 'none', '0', 'null', 'unspecified'].includes(t)) return t === 'unspecified' ? 'medium' : null;
  for (const k in FLOW_WORDS) if (t.includes(k)) return FLOW_WORDS[k];
  if (/^\d+$/.test(t)) { const n = +t; return n <= 0 ? null : n === 1 ? 'light' : n === 2 ? 'medium' : 'heavy'; }
  if (['true', 'yes', 'period', 'menstruation', 'bleeding'].some(w => t.includes(w))) return 'medium';
  return null;
}
function normDate(v) {
  if (v == null) return null; const t = String(v).trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;   // UK d/m/y
  m = t.match(/^(\d{4})(\d{2})(\d{2})$/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  const d = new Date(t); return isNaN(d) ? null : isoLocal(d);
}
const DATE_KEYS = /^(date|day|log_date|start_?date|startdate|timestamp|time|created|recorded|when)$/i;
const FLOW_KEYS = /(period|flow|menstru|bleed)/i;
const SYMPTOM_MAP = [[/cramp/i,'cramps'],[/headache|migraine/i,'headache'],[/bloat/i,'bloating'],[/fatigue|tired|exhaust|low.?energy/i,'fatigue'],[/sleep/i,'sleep'],[/flat|unmotiv|low.?mood|sad/i,'flat']];
function rowsToLogs(rows) {
  if (!rows.length) return [];
  const keys = Object.keys(rows[0]);
  const dateKey = keys.find(k => DATE_KEYS.test(k)) || keys.find(k => rows.slice(0, 20).every(r => normDate(r[k])));
  const flowKeys = keys.filter(k => FLOW_KEYS.test(k) && k !== dateKey);
  if (!dateKey) throw new Error('No date column found.');
  const byDate = {};
  rows.forEach(r => {
    const d = normDate(r[dateKey]); if (!d || d > TODAY) return;
    const e = byDate[d] || (byDate[d] = { log_date: d, period: false, flow: null, period_start: false, period_end: false, symptoms: [], note: '' });
    for (const k of flowKeys) { const f = normFlow(r[k]); if (f) { e.period = true; e.flow = f; } }
    for (const k of keys) { if (k === dateKey || flowKeys.includes(k)) continue; const v = r[k]; if (v == null || v === '' || v === false) continue;
      const text = `${k} ${typeof v === 'object' ? JSON.stringify(v) : v}`;
      SYMPTOM_MAP.forEach(([re, id]) => { if (re.test(text) && !e.symptoms.includes(id)) e.symptoms.push(id); });
      if (/^(note|notes|comment|memo)$/i.test(k)) e.note = String(v).slice(0, 300); }
  });
  return Object.values(byDate).filter(e => e.period || e.symptoms.length || e.note);
}
function parseCSV(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());
  const sep = (lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length ? ';' : ',';
  const split = l => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(x => x.trim()); };
  const head = split(lines[0]);
  return lines.slice(1).map(l => Object.fromEntries(split(l).map((v, i) => [head[i] || `c${i}`, v])));
}
function findRows(obj, depth = 0) {   // deepest-first search for an array of objects with a date-ish key
  if (depth > 6 || obj == null) return null;
  if (Array.isArray(obj)) { if (obj.length && typeof obj[0] === 'object' && Object.keys(obj[0]).some(k => DATE_KEYS.test(k))) return obj; for (const x of obj) { const r = findRows(x, depth+1); if (r) return r; } return null; }
  if (typeof obj === 'object') { for (const k of Object.keys(obj)) { const r = findRows(obj[k], depth+1); if (r) return r; } }
  return null;
}
function parseAppleHealth(xml) {
  const rows = []; const re = /<Record[^>]*type="HKCategoryTypeIdentifierMenstrualFlow"[^>]*>/g; let m;
  while ((m = re.exec(xml))) { const v = (m[0].match(/ value="([^"]+)"/) || [])[1]; const d = (m[0].match(/ startDate="([^"]+)"/) || [])[1]; if (d) rows.push({ date: d, flow: v }); }
  return rows;
}
function parseImport(text, name) {
  const t = text.trim();
  if (/HKCategoryTypeIdentifierMenstrualFlow/.test(t)) return rowsToLogs(parseAppleHealth(t));
  if (t[0] === '{' || t[0] === '[') { const rows = findRows(JSON.parse(t)); if (!rows) throw new Error('No daily records found in this JSON.'); return rowsToLogs(rows); }
  if (/\.(csv|txt|tsv)$/i.test(name) || t.includes(',') || t.includes(';')) return rowsToLogs(parseCSV(t));
  throw new Error('Unrecognised file. Export as CSV or JSON from your tracker.');
}
function ImportPanel({ logs, onDone }) {
  const [state, setState] = useState({ step:'idle' });
  const pick = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const text = await f.text(); const parsed = parseImport(text, f.name);
      const have = new Set(logs.map(l => l.log_date));
      const merged = parsed.map(p => { const ex = logs.find(l => l.log_date === p.log_date); return ex ? { ...ex, period: ex.period || p.period, flow: ex.flow || p.flow, symptoms: [...new Set([...(ex.symptoms||[]), ...p.symptoms])], note: ex.note || p.note } : p; });
      const dates = merged.map(m => m.log_date).sort();
      setState({ step:'preview', rows: merged, n: merged.length, periods: merged.filter(m => m.period).length, from: dates[0], to: dates[dates.length-1], newDays: merged.filter(m => !have.has(m.log_date)).length });
    } catch (err) { setState({ step:'error', msg: err.message }); }
    e.target.value = '';
  };
  const commit = async () => { setState(s => ({ ...s, step:'saving' })); try { await store.saveLogs(state.rows); setState({ step:'done', n: state.n }); onDone(); } catch (err) { setState({ step:'error', msg: err.message }); } };
  return <div style={{ paddingTop:14, borderTop:`1px solid ${M.ink100}` }}>
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
      <div><div style={{ fontSize:14.5, fontWeight:600 }}>Import from another app</div><div style={{ fontSize:12, color:M.ink400, marginTop:2 }}>Clue, Flo, Natural Cycles, Apple Health, Garmin — CSV, JSON or export.xml</div></div>
      <label className="press" style={{ padding:'10px 14px', borderRadius:12, border:`1.5px solid ${M.ink100}`, background:M.bone, fontSize:13, fontWeight:600, cursor:'pointer', flexShrink:0 }}>Choose file<input type="file" accept=".csv,.json,.txt,.xml,.tsv" onChange={pick} style={{ display:'none' }} /></label>
    </div>
    {state.step === 'preview' && <div style={{ marginTop:12, padding:'12px 14px', borderRadius:12, background:M.mint50, border:`1px solid ${M.mint200}` }}>
      <div style={{ fontSize:13, lineHeight:1.5 }}>Found <b>{state.n} days</b> ({state.periods} period days) from {fmtShort(state.from)} to {fmtShort(state.to)}. {state.newDays} new, {state.n - state.newDays} merged into days you've already logged — your own entries are kept.</div>
      <div style={{ display:'flex', gap:8, marginTop:10 }}><MintBtn onClick={commit} style={{ padding:'11px' }}>Import {state.n} days</MintBtn><GhostBtn onClick={() => setState({ step:'idle' })}>Cancel</GhostBtn></div>
    </div>}
    {state.step === 'saving' && <div style={{ marginTop:10, fontSize:13, color:M.ink400 }}>Saving…</div>}
    {state.step === 'done' && <div style={{ marginTop:10, fontSize:13, color:M.mint700 }}>Imported {state.n} days. Your ring and cycle length now use the full history.</div>}
    {state.step === 'error' && <div style={{ marginTop:10, fontSize:13, color:M.coral }}>{state.msg}</div>}
  </div>;
}

function Settings({ settings, onSave, onClose, logs, onImported }) {
  const [len, setLen] = useState(settings.cycle_length); const [pl, setPl] = useState(settings.period_length);
  const Row = ({ label, v, set, min, max }) => <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 0', borderTop:`1px solid ${M.ink100}` }}><span style={{ fontSize:14.5, fontWeight:600 }}>{label}</span><div style={{ display:'flex', alignItems:'center', gap:10 }}><GhostBtn onClick={() => set(Math.max(min, v-1))} style={{ padding:'6px 12px' }}>−</GhostBtn><span className="tnum" style={{ fontFamily:FONT.display, fontWeight:700, fontSize:20, width:28, textAlign:'center' }}>{v}</span><GhostBtn onClick={() => set(Math.min(max, v+1))} style={{ padding:'6px 12px' }}>+</GhostBtn></div></div>;
  return <div style={{ position:'fixed', inset:0, zIndex:80 }}>
    <div onClick={onClose} style={{ position:'absolute', inset:0, background:'rgba(21,25,26,0.4)', animation:'mFade .2s ease both' }} />
    <div className="noscroll" style={{ position:'absolute', left:0, right:0, bottom:0, maxHeight:'92%', overflowY:'auto', background:M.paper, borderRadius:'22px 22px 0 0', padding:'10px 20px calc(28px + env(safe-area-inset-bottom))', animation:'mRise .3s ease both', maxWidth:480, margin:'0 auto' }}>
      <div style={{ width:38, height:4, borderRadius:999, background:M.ink200, margin:'0 auto 14px' }} />
      <Display size={22}>Settings</Display>
      <div style={{ fontSize:12.5, color:M.ink400, marginTop:6, marginBottom:12 }}>Defaults only — once you've logged two period starts, the app uses your own cycle length instead.</div>
      <Row label="Usual cycle length" v={len} set={setLen} min={20} max={45} /><Row label="Usual period length" v={pl} set={setPl} min={2} max={10} />
      <ImportPanel logs={logs} onDone={onImported} />
      <div style={{ fontFamily:FONT.mono, fontSize:9, color:M.ink300, marginTop:14, letterSpacing:'0.06em' }}>{store.mode === 'supabase' ? `SIGNED IN · ${(store.user && store.user.email) || ''}` : 'LOCAL · THIS PHONE ONLY'}</div>
      <div style={{ marginTop:14 }}><MintBtn onClick={() => onSave({ cycle_length:len, period_length:pl })}>Save</MintBtn></div>
      {sb && <div style={{ display:'flex', gap:8, marginTop:10 }}>
        <GhostBtn onClick={() => { try { Object.keys(localStorage).filter(k => k.startsWith('method_chat_')).forEach(k => localStorage.removeItem(k)); } catch (e) {} sb.auth.signOut(); }} style={{ flex:1 }}>Sign out</GhostBtn>
        <GhostBtn onClick={async () => { if (confirm('Delete every log and your settings? This cannot be undone.')) { await sb.from('cycle_logs').delete().neq('log_date', '1900-01-01'); await sb.from('athlete_settings').delete().neq('cycle_length', -1); await sb.auth.signOut(); } }} style={{ flex:1, color:M.coral }}>Delete my data</GhostBtn>
      </div>}
    </div>
  </div>;
}

// ── App shell ───────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('today'); const [logs, setLogs] = useState([]); const [settings, setSettings] = useState({ cycle_length:28, period_length:5 });
  const [logDate, setLogDate] = useState(null); const [showSettings, setShowSettings] = useState(false); const [err, setErr] = useState(null); const [ready, setReady] = useState(false);
  const [auth, setAuth] = useState(sb ? 'checking' : 'local');
  const refresh = async () => { try { const [l, s] = await Promise.all([store.loadLogs(), store.loadSettings()]); setLogs(l); setSettings(s); setErr(null); } catch (e) { setErr(e.message || String(e)); } setReady(true); };
  useEffect(() => {
    if (!sb) { refresh(); return; }
    const apply = session => { store.user = session ? session.user : null; if (session) { setAuth('in'); setReady(false); refresh(); } else { setAuth('out'); setLogs([]); setTab('today'); } };
    sb.auth.getSession().then(({ data }) => apply(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, session) => apply(session));
    return () => sub.subscription.unsubscribe();
  }, []);
  const model = useMemo(() => cycleModel(logs, settings), [logs, settings]);
  if (auth === 'checking') return <div style={{ minHeight:'100vh', background:M.paper }} />;
  if (auth === 'out') return <Login />;
  const save = async entry => { try { await store.saveLog(entry); setLogDate(null); await refresh(); } catch (e) { setErr(e.message || String(e)); } };
  const del = async iso => { try { await store.deleteLog(iso); setLogDate(null); await refresh(); } catch (e) { setErr(e.message || String(e)); } };
  const TABS = [['today','Today','cyclef'],['history','Calendar','calendar'],['coach','Coach','chat']];
  return <div style={{ maxWidth:480, margin:'0 auto', minHeight:'100vh', background:M.paper, position:'relative' }}>
    <div className="noscroll" style={{ padding:'calc(14px + env(safe-area-inset-top)) 20px 100px' }}>
      {err && <div style={{ background:'rgba(215,117,89,0.12)', border:`1px solid ${M.coral}`, borderRadius:12, padding:'10px 12px', fontSize:12.5, color:M.ink, marginBottom:12 }}>Couldn't reach storage: {err}</div>}
      {!ready ? <div style={{ padding:'60px 0', textAlign:'center', fontFamily:FONT.mono, fontSize:10, letterSpacing:'0.12em', color:M.ink400 }}>LOADING</div>
        : tab === 'today' ? <Today logs={logs} model={model} settings={settings} onLog={setLogDate} onSettings={() => setShowSettings(true)} />
        : tab === 'history' ? <History logs={logs} model={model} onLog={setLogDate} />
        : <Coach logs={logs} model={model} />}
    </div>
    <div style={{ position:'fixed', left:0, right:0, bottom:0, maxWidth:480, margin:'0 auto', background:'rgba(245,240,232,0.92)', backdropFilter:'blur(14px)', WebkitBackdropFilter:'blur(14px)', borderTop:`1px solid ${M.ink100}`, display:'flex', padding:'8px 12px calc(10px + env(safe-area-inset-bottom))' }}>
      {TABS.map(([id, label, icon]) => { const on = tab === id; return <button key={id} onClick={() => setTab(id)} className="press" style={{ flex:1, background:'none', border:'none', display:'flex', flexDirection:'column', alignItems:'center', gap:4, padding:'6px 0' }}><Icon name={icon} size={21} color={on ? M.ink : M.ink300} stroke={on ? 1.9 : 1.5} /><span style={{ fontFamily:FONT.mono, fontSize:8.5, letterSpacing:'0.1em', color:on ? M.ink : M.ink300 }}>{label.toUpperCase()}</span></button>; })}
    </div>
    {logDate && <LogSheet date={logDate} existing={logs.find(l => l.log_date === logDate)} model={model} onClose={() => setLogDate(null)} onSave={save} onDelete={del} />}
    {showSettings && <Settings settings={settings} logs={logs} onImported={refresh} onClose={() => setShowSettings(false)} onSave={async s => { try { await store.saveSettings(s); setShowSettings(false); await refresh(); } catch (e) { setErr(e.message); } }} />}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
